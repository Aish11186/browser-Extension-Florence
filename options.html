<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Florence-2 Setup</title>
  <style>
    body { max-width: 720px; margin: 40px auto; padding: 0 24px; font: 16px system-ui, sans-serif; color: #202124; }
    h1 { margin-bottom: 8px; }
    #status { margin: 24px 0 10px; min-height: 24px; white-space: pre-wrap; }
    progress { width: 100%; height: 24px; }
    #file { color: #5f6368; margin-top: 8px; word-break: break-all; }
    button { margin-top: 24px; padding: 10px 18px; font-size: 16px; cursor: pointer; }
    .success { color: #137333; } .error { color: #c5221f; }
  </style>
</head>
<body>
  <h1>Florence-2 Setup</h1>
  <p>Click the button once to download and initialize the local Florence-2 model. Keep this page open until it reports success.</p>
  <button id="load">Load Florence-2</button>
  <div id="status">Ready to begin. No model is loaded yet.</div>
  <progress id="progress" value="0" max="100"></progress>
  <div id="file"></div>
  <script src="options.js"></script>
</body>
</html>
